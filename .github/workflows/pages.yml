name: Deploy to GitHub Pages

on:
  push:
    branches:
      - pure-frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（npm 11 与 lockfile 生成版本一致）
        run: npm install -g npm@11 && npm ci
      - name: 类型检查
        run: npx vue-tsc --noEmit
      - name: 构建（Pages 子路径）
        run: npx vite build --base=/TinyPendingItem/
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 Pages
        id: deployment
        uses: actions/deploy-pages@v4
